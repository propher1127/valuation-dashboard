<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大盘估值</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f9fafb; }
        .chart-container { height: 250px; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="w-48 bg-white border-r border-gray-200 flex flex-col pt-4 shrink-0">
        <nav class="flex-1">
            <a href="index.html" class="block px-4 py-3 text-sm font-medium bg-blue-500 text-white">大盘估值</a>
            <a href="industry.html" class="block px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100">行业估值</a>
        </nav>
    </div>

    <div class="flex-1 p-8 overflow-y-auto">
        <div class="mb-8">
            <label class="text-sm text-gray-600 mr-2">选择时间</label>
            <select id="timeRange" class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
                <option value="1">近1年</option>
                <option value="3" selected>近3年</option>
                <option value="5">近5年</option>
                <option value="10">近10年</option>
            </select>
        </div>
        <div id="charts-container" class="space-y-6"></div>
    </div>

    <script>
        // 东方财富指数代码：1=沪市，0=深市
        const INDEX_LIST = [
            { secid: '1.000001', title: '上证指数估值' },
            { secid: '0.399006', title: '创业板指数估值' },
            { secid: '1.000300', title: '沪深300估值' },
            { secid: '1.000905', title: '中证500估值' },
            { secid: '1.000852', title: '中证1000估值' }
        ];

        const TIME_DAYS = { '1': 365, '3': 1095, '5': 1825, '10': 3650 };

        function getDateRange(days) {
            const end = new Date();
            const start = new Date();
            start.setDate(end.getDate() - days);
            const fmt = (d) => {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}${m}${day}`;
            };
            return { startDate: fmt(start), endDate: fmt(end) };
        }

        // 获取实时行情
        async function fetchQuote(secid) {
            const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f57,f58,f60,f162,f169,f170`;
            const resp = await fetch(url);
            const json = await resp.json();
            return json.data || {};
        }

        // 获取K线数据
        async function fetchKline(secid, startDate, endDate) {
            const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58&klt=101&fqt=1&beg=${startDate}&end=${endDate}`;
            const resp = await fetch(url);
            const json = await resp.json();
            if (!json.data || !json.data.klines) return [];
            return json.data.klines.map(line => {
                const parts = line.split(',');
                return { date: parts[0], close: parts[2] };
            });
        }

        async function renderCharts() {
            const timeRange = document.getElementById('timeRange').value;
            const days = TIME_DAYS[timeRange] || 1095;
            const { startDate, endDate } = getDateRange(days);

            const container = document.getElementById('charts-container');
            container.innerHTML = '<div class="text-center text-gray-400 py-10">数据加载中...</div>';

            try {
                container.innerHTML = '';

                for (let i = 0; i < INDEX_LIST.length; i++) {
                    const item = INDEX_LIST[i];

                    let quote = {};
                    let klineData = [];

                    try {
                        quote = await fetchQuote(item.secid);
                    } catch (e) {
                        console.warn(`获取 ${item.title} 实时行情失败:`, e);
                    }

                    try {
                        klineData = await fetchKline(item.secid, startDate, endDate);
                    } catch (e) {
                        console.warn(`获取 ${item.title} K线失败:`, e);
                    }

                    const price = quote.f43 != null ? (quote.f43 / 100).toFixed(2) : '--';
                    const pe = quote.f162 != null ? (quote.f162 / 100).toFixed(2) : '--';

                    const div = document.createElement('div');
                    div.className = 'bg-white p-4 rounded shadow-sm border border-gray-100 mb-6';
                    div.innerHTML = `
                        <div class="flex items-center gap-4 mb-4">
                            <h3 class="font-bold text-gray-800 text-lg">${item.title}</h3>
                            <span class="text-sm text-gray-500">当前值 
                                <span class="font-semibold text-gray-700">${price}</span>
                            </span>
                            <span class="text-sm text-gray-500">当前市盈率 
                                <span class="font-semibold text-gray-700">${pe}</span>
                            </span>
                        </div>
                        <div id="chart-${i}" class="chart-container"></div>
                    `;
                    container.appendChild(div);

                    initChart(`chart-${i}`, klineData);
                }
            } catch (err) {
                console.error('数据加载失败:', err);
                container.innerHTML = `
                    <div class="text-center text-red-400 py-10">
                        数据加载失败：${err.message}<br>
                        <span class="text-sm text-gray-400">请打开 F12 控制台查看详情</span>
                    </div>`;
            }
        }

        function initChart(id, klineData) {
            const chart = echarts.init(document.getElementById(id));

            if (!klineData || klineData.length === 0) {
                chart.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#ccc', fontSize: 14 } }
                });
                return;
            }

            const dates = klineData.map(k => k.date);
            const closes = klineData.map(k => parseFloat(k.close));

            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { top: 20, right: 20, bottom: 40, left: 60 },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLabel: { fontSize: 10, color: '#999', interval: Math.floor(dates.length / 6) }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLabel: { fontSize: 10, color: '#999' }
                },
                series: [{
                    data: closes,
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { color: '#2563eb', width: 2 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(37,99,235,0.15)' },
                            { offset: 1, color: 'rgba(37,99,235,0.02)' }
                        ])
                    }
                }]
            });
        }

        document.getElementById('timeRange').addEventListener('change', renderCharts);
        renderCharts();
    </script>
</body>
</html>
