<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业估值</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f9fafb; }
        .chart-box { height: 280px; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- 左侧导航 -->
    <div class="w-48 bg-white border-r border-gray-200 flex flex-col pt-4 shrink-0">
        <nav class="flex-1">
            <a href="index.html" class="block px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100">大盘估值</a>
            <a href="industry.html" class="block px-4 py-3 text-sm font-medium bg-blue-500 text-white">行业估值</a>
        </nav>
    </div>

    <!-- 右侧主内容 -->
    <div class="flex-1 p-6 overflow-y-auto">
        <!-- 顶部筛选 -->
        <div class="flex items-center border border-gray-200 p-4 mb-8 rounded bg-white">
            <div class="mr-12">
                <span class="text-sm font-medium mr-3">选择板块</span>
                <select class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
                    <option>行业名称1</option>
                    <option>行业名称2</option>
                </select>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm font-medium">选择时间</span>
                <button class="px-4 py-1.5 text-sm rounded border border-gray-800 bg-white">近3年</button>
                <button class="px-4 py-1.5 text-sm rounded border border-gray-200 text-gray-500 bg-white">近10年</button>
                <button class="px-4 py-1.5 text-sm rounded border border-gray-200 text-gray-500 bg-white">成立以来</button>
            </div>
        </div>

        <!-- 模块一 -->
        <div class="mb-10 bg-white p-4 rounded shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 text-lg mb-4">板块走势图</h3>
            <div id="trendChart" class="chart-box"></div>
        </div>

        <!-- 模块二 -->
        <div class="mb-10 bg-white p-4 rounded shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 text-lg mb-4">营收及利润</h3>
            <div id="revenueChart" class="chart-box"></div>
        </div>

        <!-- 模块三 -->
        <div class="mb-10 bg-white p-4 rounded shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 text-lg mb-4">板块估值（市盈率）</h3>
            <div class="flex items-center gap-12 mb-4 px-4">
                <div class="flex items-center text-lg">
                    <span class="text-blue-500 font-bold mr-2">-</span>
                    <span class="text-gray-600 mr-2">当前估值：</span>
                    <span class="text-orange-500 font-bold">正常区间</span>
                </div>
                <div class="text-lg"><span class="text-gray-600 mr-2">PE：</span><span class="font-bold text-gray-800">53.44</span></div>
                <div class="text-lg"><span class="text-gray-600 mr-2">PE百分位：</span><span class="font-bold text-gray-800">65.6%</span></div>
            </div>
            <div id="peChart" class="chart-box"></div>
        </div>
    </div>

    <script>
        // 模块一：走势图
        const trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { top: 20, right: 20, bottom: 30, left: 50 },
            xAxis: { type: 'category', data: ['2023-6', '2023-12', '2024-6', '2024-12', '2025-6', '2025-12', '2026-6'], axisLabel: { fontSize: 10 } },
            yAxis: { type: 'value', min: 1000, max: 1800, axisLabel: { fontSize: 10 } },
            series: [{ data: [1100, 1400, 1350, 1700, 1550, 1200, 1500], type: 'line', smooth: true, symbol: 'none', lineStyle: { color: '#2563eb', width: 2 } }]
        });

        // 模块二：营收及利润
        const revenueChart = echarts.init(document.getElementById('revenueChart'));
        revenueChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['营收', '归母净利润'], bottom: 0 },
            grid: { top: 20, right: 20, bottom: 30, left: 50 },
            xAxis: { type: 'category', data: ['2023-6', '2023-12', '2024-6', '2024-12', '2025-6', '2025-12', '2026-6'], axisLabel: { fontSize: 10 } },
            yAxis: { type: 'value', name: '亿', axisLabel: { fontSize: 10 } },
            series: [
                { name: '营收', type: 'bar', itemStyle: { color: '#a3e635' }, data: [2100, 2050, 2100, 4900, 3200, 2100, 2100] },
                { name: '归母净利润', type: 'bar', itemStyle: { color: '#f59e0b' }, data: [1008, 1020, 1050, 2600, 1650, 1000, 1000] }
            ]
        });

        // 模块三：市盈率
        const peChart = echarts.init(document.getElementById('peChart'));
        peChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { top: 20, right: 20, bottom: 30, left: 50 },
            xAxis: { type: 'category', data: Array.from({length: 36}, (_, i) => `202${Math.floor(i/12)+3}-${(i%12)+1}`), axisLabel: { fontSize: 10 } },
            yAxis: { type: 'value', min: 20, max: 90, axisLabel: { fontSize: 10 } },
            series: [{
                data: Array.from({length: 36}, () => 40 + Math.sin(Math.random()*10)*20 + Math.random()*10),
                type: 'line', smooth: true, symbol: 'none', lineStyle: { color: '#2563eb', width: 2 },
                markArea: {
                    silent: true,
                    itemStyle: { opacity: 0.3 },
                    data: [
                        [{ yAxis: 20, itemStyle: { color: '#d1fae5' } }, { yAxis: 35 }],
                        [{ yAxis: 35, itemStyle: { color: '#fef3c7' } }, { yAxis: 65 }],
                        [{ yAxis: 65, itemStyle: { color: '#fee2e2' } }, { yAxis: 90 }]
                    ]
                }
            }]
        });
    </script>
</body>
</html>
